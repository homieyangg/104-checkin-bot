name: 104 Checkin

on:
  # 排程已改由 SG server 的 crontab 每 5 分鐘 poll（GitHub schedule 會延遲 40~90 分，
  # 害上班卡錯過窗口）。這裡只保留手動觸發備用。
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual run mode. check is safe and does not punch."
        required: true
        default: "check"
        type: choice
        options:
          - check
          - auto
          - force-in
          - force-out

permissions:
  contents: read

concurrency:
  group: checkin-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build config from secrets
        env:
          CHECKIN_USERNAME: ${{ secrets.CHECKIN_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.CHECKIN_PASSWORD }}
          CHECKIN_DEVICE_ID: ${{ secrets.CHECKIN_DEVICE_ID }}
          CHECKIN_LATITUDE: ${{ secrets.CHECKIN_LATITUDE }}
          CHECKIN_LONGITUDE: ${{ secrets.CHECKIN_LONGITUDE }}
          CHECKIN_TELEGRAM_BOT_TOKEN: ${{ secrets.CHECKIN_TELEGRAM_BOT_TOKEN }}
          CHECKIN_TELEGRAM_CHAT_ID: ${{ secrets.CHECKIN_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = [
              "CHECKIN_USERNAME",
              "CHECKIN_PASSWORD",
              "CHECKIN_DEVICE_ID",
              "CHECKIN_LATITUDE",
              "CHECKIN_LONGITUDE",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required GitHub Secrets: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          cfg = {
              "username": os.environ["CHECKIN_USERNAME"],
              "password": os.environ["CHECKIN_PASSWORD"],
              "deviceId": os.environ["CHECKIN_DEVICE_ID"],
              "latitude": float(os.environ["CHECKIN_LATITUDE"]),
              "longitude": float(os.environ["CHECKIN_LONGITUDE"]),
              "enabled": True,
              "checkin_time": "08:50",
              "checkout_time": "18:10",
              "auto_checkin_deadline": "08:59",
              "auto_window_minutes": 30,
              "telegram_bot_token": os.environ.get("CHECKIN_TELEGRAM_BOT_TOKEN", ""),
              "telegram_chat_id": os.environ.get("CHECKIN_TELEGRAM_CHAT_ID", ""),
          }

          pathlib.Path("config").mkdir(exist_ok=True)
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("logs").mkdir(exist_ok=True)
          pathlib.Path("config/config.json").write_text(
              json.dumps(cfg, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run checkin
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="auto"
          fi

          case "$MODE" in
            check)
              python3 checkin.py --check
              ;;
            auto)
              python3 checkin.py --auto --jitter 60
              ;;
            force-in)
              python3 checkin.py --force --label in
              ;;
            force-out)
              python3 checkin.py --force --label out
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 1
              ;;
          esac
